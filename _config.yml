# _config.yml
title: Harshit Jain
tagline: Associate Principal Engineer · GraphQL · Microservices · Node.js
description: >-
  Technical writing and original analysis by Harshit Jain — Associate Principal Engineer
  with 12+ years building distributed systems, GraphQL federation, and microservices at scale.
  Published work covers production architecture patterns, quantum computing research, and
  AI integration in enterprise systems.

url: "https://harshitjain.io"
baseurl: ""

github:
  username: harshitj2005

avatar: /assets/img/avatar.jpg

author:
  name: Harshit Jain
  email: Harshitj2005@gmail.com
  url: https://harshitjain.io

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-archives

jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: /tags/:name/

social:
  name: Harshit Jain
  email: Harshitj2005@gmail.com
  links:
    - https://www.linkedin.com/in/harshitj2005/
    - https://github.com/harshitj2005

theme: jekyll-theme-chirpy

analytics:
  google:
    id: G-4BPQ0QLNK1

lang: en

# Timezone
timezone: America/New_York

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  tabs:
    output: true
    sort_by: order

permalink: /posts/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      seo:
        type: WebPage

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile.lock
  - vendor
  - README.md
